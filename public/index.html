<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e3242b" />
    <link rel="apple-touch-icon" sizes="76x76" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Gestão da Escola</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
      rel="stylesheet"
    />
      <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Se o painel não abrir (ex.: Chrome muito antigo), mostra o motivo na tela em vez de deixá-la em branco.
      (function () {
        var mostrado = false;
        function escapar(t) {
          return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function vazio() {
          var r = document.getElementById("root");
          return !r || !r.firstChild;
        }
        function mostrar(motivo) {
          if (mostrado) return;
          mostrado = true;
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
          var el = document.createElement("div");
          el.setAttribute("style", "position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;padding:24px;overflow:auto");
          el.innerHTML =
            "<h2 style='margin:0 0 12px'>Não foi possível abrir o painel</h2>" +
            "<p style='line-height:1.5'>Isso costuma acontecer com navegador desatualizado. Atualize o <b>Google Chrome</b> e o <b>Android System WebView</b> na Play Store e tente de novo.</p>" +
            "<p style='opacity:.7'>Chrome " + (m ? m[1] : "não identificado") + "</p>" +
            "<pre style='white-space:pre-wrap;background:#1a1a1a;padding:12px;border-radius:8px;font-size:12px'>" + escapar(motivo) + "</pre>";
          (document.body || document.documentElement).appendChild(el);
        }
        window.onerror = function (msg, src, linha, coluna) {
          if (vazio()) mostrar(msg + (src ? "\n" + src + ":" + linha + ":" + coluna : ""));
        };
        window.addEventListener("unhandledrejection", function (e) {
          if (vazio()) mostrar("Erro: " + (e && e.reason && (e.reason.message || e.reason)));
        });
        setTimeout(function () {
          if (vazio()) mostrar("A tela continuou em branco por 10 segundos.");
        }, 10000);
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
